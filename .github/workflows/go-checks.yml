# Trusted Go checks: always-report, SHA-pinned actions. Keep the commands
# identical to docs/process/testing.md's Go suite.
#
# Dispositions:
# - The Go toolchain is the go.dev archive named by GO_ARCHIVE, verified against
#   the SHA-256 pinned in GO_ARCHIVE_SHA256 before it is extracted. These two
#   values are the pin and the source of truth: the local recipe in
#   docs/process/testing.md reads both from this file, and the dependency
#   inventory in docs/reference/source-register.md restates them only as the
#   identity its dispositions cover. If the two files disagree, this file is
#   what CI installs and the inventory row is stale. actions/setup-go is not
#   used: it installs a repackaged actions/go-versions archive, or a runner
#   tool-cache copy, and checks no digest. A go.mod `go` directive that no
#   longer matches GO_ARCHIVE fails the step; bump go.mod, both values and the
#   inventory row together, with the new digest read from
#   https://go.dev/dl/?mode=json&include=all.
# - Module cache only, no build cache: actions/cache, pinned by commit SHA,
#   restores and saves the Go module download cache under a key that is the
#   exact go.sum digest, with no restore-keys fallback. `go mod verify` then
#   checks every cached module against go.sum before anything is built. Tests
#   stay uncached (-count=1). Inventory: docs/reference/source-register.md.
# - runs-on: ubuntu-latest is a mutable GitHub-hosted runner image. This job
#   is CI infrastructure, not the product runtime profile; no product
#   deployment parameter pins a CI runner image, so no pin is applied here.
#   Revisit only if a documented deployment parameter targets CI runners.
# - Qualification local proofs run after go build, in this job, because they
#   build their //go:build ignore evaluators with the pinned Go above; a second
#   job would repeat GO_ARCHIVE_SHA256, which check-go-digest.sh refuses. Add a
#   later proof as one more step at the end, with its testing.md row. The early
#   harness proof needs unprivileged user+mount namespaces (unshare -rm).
#   ubuntu-latest denies them through AppArmor (unshare: write failed
#   /proc/self/uid_map: Operation not permitted), so one step sets
#   kernel.apparmor_restrict_unprivileged_userns=0 on this disposable VM. The
#   job already has passwordless sudo, so this grants PR code nothing new; token
#   permissions are unchanged. The step fails if the sysctl is gone, and the
#   probe step then fails the job if namespaces are still denied; nothing is
#   skipped. TMPDIR stays unset (/tmp): the harness proof exits 1 on an
#   upper-case TMPDIR.
# - The three early publication proofs (#228) need no namespaces, no locale and
#   no network: they build fixture.go with the pinned Go and drive publication.sh
#   against the fake probe and placeholder manifest in the same test directory,
#   most groups on a virtual clock (PATH shims for date and sleep). They are the
#   slowest steps here: the runner proof dominates and the other two add well
#   under a minute between them. The job's earlier steps ran in about 1.5 minutes
#   before this change, so timeout-minutes is 25 rather than 10 to leave room on
#   a slow runner; the bound is a backstop against a hang, not a budget.
name: go-checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
    steps:
      - name: Check out the PR head commit (not the synthetic merge ref)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Go toolchain (verify SHA-256, then extract)
        env:
          GO_ARCHIVE: go1.27.1.linux-amd64.tar.gz
          GO_ARCHIVE_SHA256: 63d339f0da5ab53635a56f2490a7984dfe12dfcff22ad749f63edaf590168445
        run: |
          set -euo pipefail
          test "$(uname -s)-$(uname -m)" = Linux-x86_64
          test "$GO_ARCHIVE" = "go$(awk '$1 == "go" { print $2 }' go.mod).linux-amd64.tar.gz"
          curl -fsSL --proto '=https' --proto-redir '=https' -o "$RUNNER_TEMP/$GO_ARCHIVE" "https://go.dev/dl/$GO_ARCHIVE"
          (cd "$RUNNER_TEMP" && echo "$GO_ARCHIVE_SHA256  $GO_ARCHIVE" | sha256sum -c -)
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/$GO_ARCHIVE"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
      - name: Restore Go module cache (keyed by go.sum)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
      - name: Record tested commit and toolchain
        run: git rev-parse HEAD && command -v go && go version && go env GOROOT
      - name: go mod verify (cached modules match go.sum)
        run: go mod verify
      - name: gofmt (no unformatted files)
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test (race, uncached)
        run: go test -count=1 -race -v ./...
      - name: go build
        run: go build ./...
      - name: Allow unprivileged user namespaces (hosted runner AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Early harness namespace probe (unshare -rm; denied fails, no skip)
        run: unshare -rm mount -t tmpfs none /tmp
      - name: go vet early evaluator (build-ignored result.go)
        run: go vet scripts/qualification/early/result.go
      - name: Early evaluator local proof (crafted traces)
        run: bash tests/qualification/early_harness/test-result.sh
      - name: Early harness local proof (fake launcher)
        run: bash tests/qualification/early_harness/test-harness.sh
      - name: Early publication input proof (trace and procedure grammar)
        run: bash tests/qualification/early_publication/test-input.sh
      - name: Early publication evaluator proof (crafted traces)
        run: bash tests/qualification/early_publication/test-fixture.sh
      - name: Early publication runner local proof (fake probe, virtual clock)
        run: bash tests/qualification/early_publication/test-publication.sh
